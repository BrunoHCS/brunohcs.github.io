<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Conceito de cartão de progresso do curso</title>
  <desc id="desc">Prévia ilustrativa do cartão Estudos em Foco: Fundamentos de JavaScript, 68 por cento concluído, 17 de 25 aulas e 12 horas e 40 minutos de foco.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1119"/><stop offset=".55" stop-color="#101925"/><stop offset="1" stop-color="#142030"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1ea7ff"/><stop offset="1" stop-color="#69d3ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#1ea7ff" stop-opacity=".22"/><stop offset="1" stop-color="#1ea7ff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1030" cy="145" r="310" fill="url(#glow)"/>
  <circle cx="120" cy="1110" r="260" fill="#3ddc97" opacity=".055"/>
  <rect x="44" y="44" width="1112" height="1112" rx="34" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>

  <rect x="92" y="96" width="12" height="38" rx="6" fill="#1ea7ff"/>
  <text x="128" y="124" fill="#e8eef6" font-family="Manrope,Segoe UI,sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">ESTUDOS EM FOCO</text>
  <text x="92" y="205" fill="#93a4ba" font-family="Manrope,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="2">MEU PROGRESSO</text>
  <text x="92" y="282" fill="#fff" font-family="Sora,Segoe UI,sans-serif" font-size="54" font-weight="700">Fundamentos de</text>
  <text x="92" y="346" fill="#fff" font-family="Sora,Segoe UI,sans-serif" font-size="54" font-weight="700">JavaScript</text>
  <path d="M92 390H1108" stroke="#ffffff" stroke-opacity=".17" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="92" y="430" width="1016" height="432" rx="30" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".12"/>
  </g>
  <text x="142" y="492" fill="#93a4ba" font-family="Manrope,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="1.3">SUA JORNADA</text>

  <circle cx="350" cy="650" r="143" fill="#0c1520" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="350" cy="650" r="118" fill="none" stroke="#243447" stroke-width="18"/>
  <circle cx="350" cy="650" r="118" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round" stroke-dasharray="504 742" transform="rotate(-90 350 650)"/>
  <text x="350" y="654" text-anchor="middle" fill="#fff" font-family="Sora,Segoe UI,sans-serif" font-size="69" font-weight="700">68%</text>
  <text x="350" y="698" text-anchor="middle" fill="#93a4ba" font-family="Manrope,Segoe UI,sans-serif" font-size="17" font-weight="600">CONCLUÍDO</text>

  <path d="M565 535V810" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <text x="620" y="575" fill="#93a4ba" font-family="Manrope,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">AULAS CONCLUÍDAS</text>
  <text x="620" y="655" fill="#63c2ff" font-family="Sora,Segoe UI,sans-serif" font-size="66" font-weight="700">17<tspan fill="#93a4ba" font-size="34" font-weight="500"> / 25</tspan></text>
  <rect x="620" y="684" width="420" height="12" rx="6" fill="#263749"/>
  <rect x="620" y="684" width="286" height="12" rx="6" fill="url(#ring)"/>
  <circle cx="620" cy="755" r="6" fill="#3ddc97"/>
  <text x="640" y="762" fill="#e8eef6" font-family="Manrope,Segoe UI,sans-serif" font-size="20" font-weight="500">Mais um passo na sua jornada.</text>

  <rect x="92" y="892" width="1016" height="112" rx="22" fill="#3ddc97" fill-opacity=".07" stroke="#3ddc97" stroke-opacity=".18"/>
  <circle cx="151" cy="948" r="25" fill="#3ddc97" fill-opacity=".14"/>
  <path d="M151 933v16l12 7" fill="none" stroke="#3ddc97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="202" y="937" fill="#93a4ba" font-family="Manrope,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">TEMPO DE FOCO</text>
  <text x="202" y="975" fill="#3ddc97" font-family="Sora,Segoe UI,sans-serif" font-size="31" font-weight="700">12h 40min</text>
  <text x="1060" y="957" text-anchor="end" fill="#e8eef6" font-family="Manrope,Segoe UI,sans-serif" font-size="18" font-weight="500">de dedicação a este curso</text>

  <text x="92" y="1084" fill="#93a4ba" font-family="Manrope,Segoe UI,sans-serif" font-size="23" font-weight="500">Um passo de cada vez.</text>
  <text x="1108" y="1084" text-anchor="end" fill="#63c2ff" font-family="Manrope,Segoe UI,sans-serif" font-size="20" font-weight="600">brunohcs.github.io/estudos</text>
  <text x="600" y="1130" text-anchor="middle" fill="#93a4ba" fill-opacity=".55" font-family="Manrope,Segoe UI,sans-serif" font-size="13">PRÉVIA CONCEITUAL · DADOS ILUSTRATIVOS</text>
</svg>
